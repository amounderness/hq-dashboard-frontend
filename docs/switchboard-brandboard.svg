<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 900" role="img" aria-labelledby="title description">
  <title id="title">Switchboard approved brand concept</title>
  <desc id="description">The Ward Mosaic logo in a website header and at five preview sizes, the continuous two-colour switchboard wordmark, Electoral Intelligence subtitle, and the deep petrol, graphite, white and pale turquoise palette.</desc>
  <defs>
    <symbol id="mark" viewBox="0 0 180 180">
      <rect width="180" height="180" rx="29" fill="#E8F2F0"/>
      <path d="M27 27H92L82 81 27 87Z" fill="#2D797A"/>
      <path d="M92 27H153V70L119 89 82 81Z" fill="#7BB2AA"/>
      <path d="M27 87 82 81 92 153H27Z" fill="#5B9D99"/>
      <path d="M82 81 119 89 153 70V153H92Z" fill="#1D6568"/>
      <path d="M92 27 82 81 27 87M82 81 119 89 153 70M82 81 92 153" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt" stroke-linejoin="round"/>
      <rect x="27" y="27" width="126" height="126" fill="none" stroke="#FFFFFF" stroke-width="7"/>
    </symbol>
  </defs>
  <rect width="1500" height="900" fill="#F7F8F6"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="60" y="61" fill="#52636A" font-size="19" font-weight="700" letter-spacing="2.5">SWITCHBOARD / BRAND CONCEPT</text>
    <text x="60" y="111" fill="#1E3038" font-size="38" font-weight="700" letter-spacing="-1">Ward Mosaic · Electoral Intelligence</text>

    <rect x="60" y="150" width="1380" height="280" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
    <text x="94" y="188" fill="#52636A" font-size="16" font-weight="700" letter-spacing="1.5">PRIMARY LOCKUP</text>
    <use href="#mark" x="106" y="207" width="190" height="190"/>
    <text x="337" y="308" font-size="103" font-weight="700" letter-spacing="-6.5"><tspan fill="#1E3038">switch</tspan><tspan fill="#1D6568">board</tspan></text>
    <text x="343" y="357" fill="#52636A" font-size="27" letter-spacing="5">ELECTORAL INTELLIGENCE</text>
    <text x="108" y="412" fill="#74818A" font-size="14">Four touching ward shapes · shared white borders · pale turquoise rounded background</text>

    <rect x="60" y="457" width="790" height="351" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
    <text x="92" y="500" fill="#1E3038" font-size="25" font-weight="700">Icon at preview sizes</text>
    <text x="92" y="528" fill="#52636A" font-size="16">Same vector artwork from header mark to favicon.</text>
    <use href="#mark" x="100" y="567" width="128" height="128"/>
    <use href="#mark" x="300" y="631" width="64" height="64"/>
    <use href="#mark" x="457" y="647" width="48" height="48"/>
    <use href="#mark" x="601" y="663" width="32" height="32"/>
    <use href="#mark" x="729" y="679" width="16" height="16"/>
    <g fill="#52636A" font-size="15">
      <text x="138" y="736">128 px</text><text x="310" y="736">64 px</text>
      <text x="464" y="736">48 px</text><text x="601" y="736">32 px</text><text x="719" y="736">16 px</text>
    </g>
    <text x="92" y="783" fill="#74818A" font-size="14">The 16 px view retains the four-area silhouette; finer seam detail is secondary.</text>

    <rect x="877" y="457" width="563" height="351" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
    <text x="909" y="500" fill="#1E3038" font-size="25" font-weight="700">Colour system</text>
    <text x="909" y="528" fill="#52636A" font-size="16">Interface colours; party-result colours remain separate.</text>
    <g font-size="15" fill="#1E3038">
      <rect x="909" y="565" width="104" height="88" rx="8" fill="#1D6568"/>
      <text x="909" y="680" font-weight="700">Deep petrol</text><text x="909" y="704" fill="#52636A">#1D6568</text>
      <rect x="1041" y="565" width="104" height="88" rx="8" fill="#1E3038"/>
      <text x="1041" y="680" font-weight="700">Graphite</text><text x="1041" y="704" fill="#52636A">#1E3038</text>
      <rect x="1173" y="565" width="104" height="88" rx="8" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
      <text x="1173" y="680" font-weight="700">White</text><text x="1173" y="704" fill="#52636A">#FFFFFF</text>
      <rect x="1305" y="565" width="104" height="88" rx="8" fill="#E8F2F0"/>
      <text x="1305" y="680" font-weight="700">Pale aqua</text><text x="1305" y="704" fill="#52636A">#E8F2F0</text>
    </g>
    <text x="909" y="783" fill="#74818A" font-size="14">Warm neutral page canvas: #F7F8F6</text>

    <text x="60" y="858" fill="#52636A" font-size="15">Production direction · continuous one-word mark · subtitle approved 26 September 2026</text>
    <text x="1440" y="858" text-anchor="end" fill="#74818A" font-size="14">Switchboard Leeds pilot</text>
  </g>
</svg>
