<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1450 900" role="img" aria-labelledby="title description">
  <title id="title">Switchboard map icon concepts, third round</title>
  <desc id="description">Three organic ward-map mosaic symbols inspired by the Explorer: Open Mosaic, Junction Map and Selected Ward. Each has an irregular silhouette, connected ward areas and multiple boundary nodes.</desc>
  <defs>
    <symbol id="open-mosaic" viewBox="0 0 180 180">
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round">
        <path d="M27 42 80 18 83 64 52 82 17 91 14 75Z" fill="#6AA6A0"/>
        <path d="M84 18 137 29 163 72 123 82 83 64Z" fill="#2E7E7E"/>
        <path d="M17 95 52 85 82 117 87 163 29 143 14 111Z" fill="#8EC1B5"/>
        <path d="M54 82 84 66 122 84 115 123 82 117Z" fill="#1D6568"/>
        <path d="M125 85 163 76 143 139 90 164 83 120 116 125Z" fill="#4A9290"/>
      </g>
      <g fill="#1E3038" stroke="#FFFFFF" stroke-width="2.5">
        <circle cx="83" cy="65" r="5.5"/><circle cx="52" cy="83" r="5.5"/>
        <circle cx="123" cy="83" r="5.5"/><circle cx="82" cy="118" r="5.5"/>
        <circle cx="116" cy="124" r="5.5"/>
      </g>
    </symbol>

    <symbol id="junction-map" viewBox="0 0 180 180">
      <path d="M23 33 65 20 104 31 151 21 166 69 151 119 120 157 54 151 15 110Z" fill="#E8F2F0" stroke="#1E3038" stroke-width="6" stroke-linejoin="round"/>
      <g fill="none" stroke="#3C8584" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M65 20 58 72 15 110M104 31 93 72 151 21M58 72 93 72 126 98 166 69M58 72 77 117 54 151M77 117 126 98 120 157M126 98 151 119"/>
      </g>
      <path d="M58 72 93 72 126 98 77 117Z" fill="#1D6568" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round"/>
      <g fill="#1E3038" stroke="#FFFFFF" stroke-width="2.5">
        <circle cx="58" cy="72" r="6"/><circle cx="93" cy="72" r="6"/>
        <circle cx="126" cy="98" r="6"/><circle cx="77" cy="117" r="6"/>
        <circle cx="65" cy="20" r="5"/><circle cx="120" cy="157" r="5"/>
      </g>
    </symbol>

    <symbol id="selected-ward" viewBox="0 0 180 180">
      <g stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round">
        <path d="M25 26 84 14 67 53 55 108 18 78Z" fill="#91BCB3"/>
        <path d="M84 14 144 29 119 50 67 53Z" fill="#5B9D99"/>
        <path d="M144 29 166 78 137 98 119 50Z" fill="#B7D5CA"/>
        <path d="M166 78 147 145 95 130 137 98Z" fill="#7EB0A8"/>
        <path d="M147 145 88 164 39 142 55 108 95 130Z" fill="#A5C9BD"/>
        <path d="M39 142 15 116 18 78 55 108Z" fill="#75AAA4"/>
      </g>
      <path d="M67 53 119 50 137 98 95 130 55 108Z" fill="#1D6568" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round"/>
      <path d="M67 53 119 50 137 98 95 130 55 108Z" fill="none" stroke="#1E3038" stroke-width="2.8" stroke-linejoin="round"/>
      <g fill="#1E3038" stroke="#FFFFFF" stroke-width="2.5">
        <circle cx="67" cy="53" r="5"/><circle cx="119" cy="50" r="5"/>
        <circle cx="137" cy="98" r="5"/><circle cx="95" cy="130" r="5"/>
        <circle cx="55" cy="108" r="5"/>
      </g>
    </symbol>
  </defs>

  <rect width="1450" height="900" fill="#F7F8F6"/>
  <g font-family="Arial,Helvetica,sans-serif">
    <text x="55" y="59" fill="#526078" font-size="17" font-weight="700" letter-spacing="2">SWITCHBOARD / MAP ICON EXPLORATION 03</text>
    <text x="55" y="114" fill="#1E3038" font-size="43" font-weight="700" letter-spacing="-1.5">A more open ward mosaic</text>
    <text x="55" y="149" fill="#526078" font-size="20">Three variations of the first Ward Mosaic: irregular edges, shared boundaries and visible nodes.</text>
    <text x="1110" y="113" font-size="42" font-weight="700" letter-spacing="-2.5"><tspan fill="#1E3038">switch</tspan><tspan fill="#1D6568">board</tspan></text>
    <text x="1113" y="145" fill="#74818A" font-size="13" letter-spacing="1.2">CONTINUOUS WORDMARK</text>

    <g id="concept-a">
      <rect x="55" y="199" width="425" height="615" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
      <text x="82" y="241" fill="#526078" font-size="15" font-weight="700" letter-spacing="1.4">01 / OPEN MOSAIC</text>
      <use href="#open-mosaic" x="144" y="275" width="245" height="245"/>
      <text x="82" y="565" fill="#1E3038" font-size="27" font-weight="700">Closest to the original</text>
      <text x="82" y="602" fill="#526078" font-size="17">Five coloured ward shapes, now with</text>
      <text x="82" y="629" fill="#526078" font-size="17">an irregular outer edge and junction</text>
      <text x="82" y="656" fill="#526078" font-size="17">nodes instead of a square tile.</text>
      <line x1="82" y1="695" x2="452" y2="695" stroke="#DCE3E2" stroke-width="2"/>
      <text x="82" y="730" fill="#526078" font-size="14">Small-size check</text>
      <use href="#open-mosaic" x="205" y="704" width="47" height="47"/>
      <text x="82" y="783" fill="#1D6568" font-size="14" font-weight="700">FRIENDLY · GEOGRAPHIC · MULTI-LAYERED</text>
    </g>

    <g id="concept-b">
      <rect x="512" y="199" width="425" height="615" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
      <text x="539" y="241" fill="#526078" font-size="15" font-weight="700" letter-spacing="1.4">02 / JUNCTION MAP</text>
      <use href="#junction-map" x="601" y="275" width="245" height="245"/>
      <text x="539" y="565" fill="#1E3038" font-size="27" font-weight="700">Boundaries as a network</text>
      <text x="539" y="602" fill="#526078" font-size="17">The ward lines become connections;</text>
      <text x="539" y="629" fill="#526078" font-size="17">six nodes mark joins and one area is</text>
      <text x="539" y="656" fill="#526078" font-size="17">selected within the whole region.</text>
      <line x1="539" y1="695" x2="909" y2="695" stroke="#DCE3E2" stroke-width="2"/>
      <text x="539" y="730" fill="#526078" font-size="14">Small-size check</text>
      <use href="#junction-map" x="662" y="704" width="47" height="47"/>
      <text x="539" y="783" fill="#1D6568" font-size="14" font-weight="700">SYSTEMATIC · CONNECTED · EXPLORABLE</text>
    </g>

    <g id="concept-c">
      <rect x="969" y="199" width="425" height="615" rx="18" fill="#FFFFFF" stroke="#DCE3E2" stroke-width="2"/>
      <text x="996" y="241" fill="#526078" font-size="15" font-weight="700" letter-spacing="1.4">03 / SELECTED WARD</text>
      <use href="#selected-ward" x="1058" y="275" width="245" height="245"/>
      <text x="996" y="565" fill="#1E3038" font-size="27" font-weight="700">The Explorer moment</text>
      <text x="996" y="602" fill="#526078" font-size="17">Neighbouring areas recede while</text>
      <text x="996" y="629" fill="#526078" font-size="17">one ward gets the light-and-dark</text>
      <text x="996" y="656" fill="#526078" font-size="17">outline used for map selection.</text>
      <line x1="996" y1="695" x2="1366" y2="695" stroke="#DCE3E2" stroke-width="2"/>
      <text x="996" y="730" fill="#526078" font-size="14">Small-size check</text>
      <use href="#selected-ward" x="1119" y="704" width="47" height="47"/>
      <text x="996" y="783" fill="#1D6568" font-size="14" font-weight="700">FOCUSED · ACTIVE · EXPLORER-LED</text>
    </g>

    <text x="55" y="859" fill="#526078" font-size="16">Abstract geography: no shape represents a real Leeds ward. The strongest direction should be simplified again for favicon use.</text>
    <text x="1395" y="859" text-anchor="end" fill="#74818A" font-size="15">Draft concepts only · live site unchanged</text>
  </g>
</svg>
